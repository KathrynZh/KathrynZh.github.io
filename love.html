        async function loadData() {
          try {
            const res = await fetch(`${BASE_URL}/start-time`);
            const data = await res.json();
            if (data.startTime) {
              startTime = new Date(data.startTime);
            } else {
              startTime = null;
            }
          } catch (e) {
            console.error('加载 start-time 出错', e);
            startTime = null;
          }

          try {
            const historyRes = await fetch(`${BASE_URL}/history`);
            const historyData = await historyRes.json();
            history = Array.isArray(historyData.history) ? historyData.history : [];
          } catch (e) {
            console.error('加载 history 出错', e);
            history = [];
          }
        }

        // 保存共享开始时间
        async function saveStartTimeToServer() {
          try {
            await fetch(`${BASE_URL}/start-time`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ startTime: startTime.toISOString() })
            });
          } catch (err) {
            console.error('保存服务器时间失败', err);
          }
        }

          saveHistoryToServer();

          }
          saveHistoryToServer();
        }

        async function saveHistoryToServer() {
          //if (!history.length) return;

          try {
            await fetch(`${BASE_URL}/history`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },

        function initializeApp() {
            const title = document.getElementById('page-title');

            if (startTime) {
                document.getElementById('main-screen').style.display = 'block';
                document.getElementById('setup-screen').classList.remove('active');
                
                title.textContent = '💗 本恋爱已安全运行';
                title.style.visibility = 'visible';
                title.style.opacity = 1;

                startTimer();
            } else {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('setup-screen').classList.add('active');
                document.getElementById('timer-display').innerHTML = ''; // 清除加载中
                document.getElementById('milestone-message').textContent = '';
                document.getElementById('milestone-message').classList.remove('show');

                const now = new Date();
                const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                  .toISOString().slice(0, 16);
                document.getElementById('initial-time').value = localDateTime;

                title.textContent = '💕 恋爱安全运行记录';
                title.style.visibility = 'visible';
                title.style.opacity = 1;
            }
        }

        function setInitialTime() {
            const timeInput = document.getElementById('initial-time').value;
            if (!timeInput) {
                alert('请选择一个时间');
                return;
            }

            startTime = new Date(timeInput);

            if (lastEndTime) {
                const newStart = new Date(timeInput);
                const breakDuration = newStart - lastEndTime;
                if (breakDuration > 0) {
                    const breakDays = Math.floor(breakDuration / (1000 * 60 * 60 * 24));
                    const breakHours = Math.floor((breakDuration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const breakMinutes = Math.floor((breakDuration % (1000 * 60 * 60)) / (1000 * 60));

                    history.unshift({
                        id: 'break-' + Date.now(), // 方便区分
                        isBreak: true, // 🆕 用于渲染时判断
                        startTime: lastEndTime.toISOString(),
                        endTime: newStart.toISOString(),
                        duration: breakDuration,
                        durationText: `${breakDays}天${breakHours}小时${breakMinutes}分钟`
                    });
                    lastEndTime = null; // 🆕 清空已使用的记录
                }
            }

            //saveStartTimeToServer(); // 🔁 写入服务器
            saveData();
            //saveData({ skipServer: true }); // ✅ 避免重复写入

            //修改标题
            document.querySelector('.title').textContent = '💗 本恋爱已安全运行';

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('main-screen').style.display = 'block';

            startTimer();
            updateTimerDisplay();
            document.getElementById('milestone-message').style.display = 'block';
        }

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function updateTimerDisplay() {
            if (!startTime) return;

            const now = new Date();
            const timeDiff = now - startTime;

            if (timeDiff < 0) {
                document.getElementById('timer-display').innerHTML = '时间设置有误，请重新设置';
                return;
            }

            const seconds = Math.floor(timeDiff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            const displaySeconds = seconds % 60;
            const displayMinutes = minutes % 60;
            const displayHours = hours % 24;

            const timeText = `
                <span class="time-number">${days}</span> 天 
                <span class="time-number">${displayHours}</span> 小时 
                <span class="time-number">${displayMinutes}</span> 分钟 
                <span class="time-number">${displaySeconds}</span> 秒`;

            document.getElementById('timer-display').innerHTML = timeText;

            const messageEl = document.getElementById('milestone-message');
            let message = '';

             if (days >= 60) {
                message = `本恋爱已连续安全运行 ${days} 天，系统认证：超级稳定情侣 👩🏻‍❤️‍💋‍👨🏻`;
            /*} else if (days >= 60) {
                message = `已经两个月啦，谢谢你和我一起坚持不争吵 🥰`;*/
            } else if (days >= 30) {
                message = `已经一个月啦，谢谢你和我一起坚持不争吵 🥰`;
            } else if (days >= 15) {
                message = `连续 ${days} 天和平运行，恋爱系统表示非常满意 ✨！`;
            } else if (days >= 7) {
                message = `咚咚锵～恋爱小火车稳稳运行 ${days} 天咯 🚂💞`;
            }
            
            if (message) {
                messageEl.textContent = message;
                messageEl.classList.add('show');
            } else {
                messageEl.textContent = '';
                messageEl.classList.remove('show');
            }
        }

        function showResetModal() {
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('quarrel-time-input').value = localDateTime;
            document.getElementById('reset-modal').classList.add('active');
        }

        async function handleConfirmReset() {
            if (startTime) {
                const now = new Date();
                const duration = now - startTime;
                const days = Math.floor(duration / (1000 * 60 * 60 * 24));
                const hours = Math.floor((duration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((duration % (1000 * 60 * 60)) / (1000 * 60));

                history.unshift({
                    id: Date.now(),
                    startTime: startTime.toISOString(),
                    endTime: now.toISOString(),
                    duration: duration,
                    durationText: `${days}天${hours}小时${minutes}分钟`
                });
            }

            startTime = null;
            await clearServerStartTime(); // ✅ 等待服务器清除完成再继续
            localStorage.removeItem('loveTimerStart'); // ✅关键修改：彻底清除 startTime
            saveData();

            closeModal('reset-modal');
            initializeApp();

            // ✅ 清除 milestone message
            document.getElementById('milestone-message').textContent = '';
            document.getElementById('milestone-message').classList.remove('show');
        }

        function showHistoryModal() {
            renderHistoryList();
            document.getElementById('history-modal').classList.add('active');
        }

        function deleteHistoryItem(id) {
            //history = history.filter(item => item.id !== id);
            history = history.filter(item => item.id.toString() !== id.toString()); // ✅ 改为字符串比较
            saveData();
            renderHistoryList();
        }

        function renderHistoryList() {
            const historyList = document.getElementById('history-list');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无历史记录</div>';
                return;
            }

            let html = '';
            let safetyCount = history.filter(i => !i.isBreak).length; // 先统计总次数
            history.forEach((item) => {
                const startDate = new Date(item.startTime);
                const endDate = new Date(item.endTime);
                const formatStart = startDate.toLocaleString('zh-CN');
                const formatEnd = endDate.toLocaleString('zh-CN');
                const isBreak = item.isBreak;

                const label = isBreak
                    ? `🛑 第 ${safetyCount} 次事故`
                    : `第 ${safetyCount--} 次安全记录`;

                html += `
                    <div class="history-item">
                        <button class="delete-btn" onclick="deleteHistoryItem('${item.id}')">×</button>
                        <div class="history-title">${label}</div>
                        <div class="history-details">
                            ${isBreak ? '间隔时长：' : '运行时长：'}${item.durationText}<br>
                            ${isBreak ? '事故时间：' : '起始时间：'}${formatStart}<br>
                            ${isBreak ? '恢复时间：' : '结束时间：'}${formatEnd}
                        </div>
                    </div>`;
            });

            /*history.forEach((item, index) => {
                const startDate = new Date(item.startTime);
                const formatDate = startDate.toLocaleString('zh-CN');

                html += `
                    <div class="history-item">
                        <button class="delete-btn" onclick="deleteHistoryItem(${item.id})">×</button>
                        <div class="history-title">第 ${history.length - index} 次记录</div>
                        <div class="history-details">
                            运行时长：${item.durationText}<br>
                            起始时间：${formatDate}
                        </div>
                    </div>`;
            });*/

            historyList.innerHTML = html;
        }

        /*function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }*/

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('closing');
            setTimeout(() => {
            modal.classList.remove('active', 'closing');
        }, 300); // 与 fadeOut 动画一致
    }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        window.addEventListener('beforeunload', function () {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
        });

        window.addEventListener('focus', function () {
            if (startTime && !timerInterval) {
                startTimer();
            }
        });

        async function handleConfirmResetWithTime() {
            const timeInput = document.getElementById('quarrel-time-input').value;
            if (!timeInput) {
              alert('请填写事故时间');
              return;
            }

            const customEndTime = new Date(timeInput);
            if (!startTime) {
              alert('开始时间不存在，请刷新页面重试');
              return;
            }

            if (customEndTime <= startTime) {
              alert('事故时间必须在开始时间之后');
              return;
            }

            const duration = customEndTime - startTime;
            const days = Math.floor(duration / (1000 * 60 * 60 * 24));
            const hours = Math.floor((duration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((duration % (1000 * 60 * 60)) / (1000 * 60));

            history.unshift({
              id: Date.now(),
              startTime: startTime.toISOString(),
              endTime: customEndTime.toISOString(),
              duration: duration,
              durationText: `${days}天${hours}小时${minutes}分钟`
            });

            lastEndTime = customEndTime; // 🆕 新增：记录上一次的结束时间

            await clearServerStartTime();
            localStorage.removeItem('loveTimerStart');
            saveData();

            // 使用事故发生时间作为新的 startTime（为了让计时器继续计算事故持续时长）
            startTime = customEndTime;
            closeModal('reset-modal');

            // 切换 UI：不再回到设置界面，而是展示事故计时器
            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('main-screen').style.display = 'block';

            // 修改标题文字和样式为“事故模式”
            const titleEl = document.querySelector('.title');
            titleEl.textContent = '💔 本次事故已持续';
            titleEl.style.background = 'linear-gradient(135deg, #6a4c93, #9e768f)';
            titleEl.style.webkitBackgroundClip = 'text';
            titleEl.style.webkitTextFillColor = 'transparent';

// 启动计时器
startTimer();

          }
