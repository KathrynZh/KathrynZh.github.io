<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本恋爱安全运行时间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?ixlib=rb-4.0.3&auto=format&fit=crop&w=2340&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 192, 203, 0.3), rgba(255, 182, 193, 0.4));
            backdrop-filter: blur(2px);
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #d63384;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #d63384, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .setup-form {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        .datetime-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 16px;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .datetime-input:focus {
            outline: none;
            border-color: #d63384;
            box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #d63384, #e91e63);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .timer-display {
            margin: 30px 0;
            padding: 25px;
            background: linear-gradient(135deg, rgba(214, 51, 132, 0.05), rgba(233, 30, 99, 0.05));
            border-radius: 16px;
            border: 1px solid rgba(214, 51, 132, 0.1);
        }

        .timer-text {
            font-size: 24px;
            font-weight: 600;
            color: #d63384;
            margin-bottom: 15px;
        }

        .time-value {
            font-size: 20px;
            color: #333;
            font-weight: 500;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #495057);
            font-size: 14px;
            padding: 10px 20px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        .history-section {
            margin-top: 25px;
        }

        .history-toggle {
            background: linear-gradient(135deg, #17a2b8, #138496);
            font-size: 14px;
            padding: 10px 20px;
            margin-bottom: 15px;
        }

        .history-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: rgba(248, 249, 250, 0.8);
            border-radius: 12px;
        }

        .history-list.expanded {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #d63384;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-duration {
            font-weight: 600;
            color: #d63384;
            margin-bottom: 5px;
        }

        .history-date {
            font-size: 12px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 320px;
            width: 90%;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .modal-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .modal-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .timer-text {
                font-size: 20px;
            }
            
            .time-value {
                font-size: 18px;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">💕 本恋爱安全运行时间</h1>
        
        <!-- 设置表单 -->
        <div id="setupForm" class="setup-form">
            <div class="input-group">
                <label for="startTime">请设定恋爱开始时间：</label>
                <input type="datetime-local" id="startTime" class="datetime-input">
            </div>
            <button class="btn" onclick="startTimer()">开始记录我们的美好时光</button>
        </div>
        
        <!-- 计时器显示 -->
        <div id="timerSection" class="hidden">
            <div class="timer-display">
                <div class="timer-text">我们已经相爱了</div>
                <div id="timeDisplay" class="time-value">0天 0小时 0分钟 0秒</div>
            </div>
            
            <div class="controls">
                <button class="btn btn-danger" onclick="showResetModal()">清零重开</button>
                <button class="btn btn-secondary history-toggle" onclick="toggleHistory()">历史记录</button>
            </div>
            
            <div class="history-section">
                <div id="historyList" class="history-list"></div>
            </div>
        </div>
    </div>
    
    <!-- 确认弹窗 -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">确认清零</div>
            <div class="modal-text">确定要清零当前记录吗？<br>当前的美好时光将被保存到历史记录中。</div>
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="resetTimer()">确认清零</button>
                <button class="btn btn-secondary" onclick="hideResetModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let timerInterval = null;
        let startTimestamp = null;
        let historyData = [];

        // 初始化应用
        function initApp() {
            loadData();
            
            if (startTimestamp) {
                showTimerSection();
                startTimerUpdates();
            } else {
                showSetupForm();
            }
            
            // 设置默认时间为当前时间
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            document.getElementById('startTime').value = localDateTime;
        }

        // 从内存中加载数据（注意：不使用localStorage）
        function loadData() {
            // 这里我们使用内存存储，页面刷新后数据会丢失
            // 在实际环境中可以使用localStorage
            if (window.loveTimerData) {
                startTimestamp = window.loveTimerData.startTimestamp;
                historyData = window.loveTimerData.historyData || [];
            }
        }

        // 保存数据到内存
        function saveData() {
            window.loveTimerData = {
                startTimestamp: startTimestamp,
                historyData: historyData
            };
        }

        // 显示设置表单
        function showSetupForm() {
            document.getElementById('setupForm').classList.remove('hidden');
            document.getElementById('timerSection').classList.add('hidden');
        }

        // 显示计时器部分
        function showTimerSection() {
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('timerSection').classList.remove('hidden');
            updateHistoryDisplay();
        }

        // 开始计时
        function startTimer() {
            const startTimeInput = document.getElementById('startTime').value;
            
            if (!startTimeInput) {
                alert('请选择恋爱开始时间！');
                return;
            }
            
            startTimestamp = new Date(startTimeInput).getTime();
            
            if (startTimestamp > Date.now()) {
                alert('开始时间不能是未来时间哦！');
                return;
            }
            
            saveData();
            showTimerSection();
            startTimerUpdates();
        }

        // 开始定时更新
        function startTimerUpdates() {
            updateTimeDisplay();
            timerInterval = setInterval(updateTimeDisplay, 1000);
        }

        // 更新时间显示
        function updateTimeDisplay() {
            if (!startTimestamp) return;
            
            const now = Date.now();
            const diff = now - startTimestamp;
            
            const seconds = Math.floor(diff / 1000) % 60;
            const minutes = Math.floor(diff / (1000 * 60)) % 60;
            const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            const timeText = `${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
            document.getElementById('timeDisplay').textContent = timeText;
        }

        // 显示重置确认弹窗
        function showResetModal() {
            document.getElementById('resetModal').style.display = 'block';
        }

        // 隐藏重置确认弹窗
        function hideResetModal() {
            document.getElementById('resetModal').style.display = 'none';
        }

        // 重置计时器
        function resetTimer() {
            if (!startTimestamp) return;
            
            // 计算当前持续时间
            const now = Date.now();
            const duration = now - startTimestamp;
            
            // 添加到历史记录
            const historyItem = {
                startTime: new Date(startTimestamp),
                endTime: new Date(now),
                duration: duration,
                timestamp: now
            };
            
            historyData.unshift(historyItem); // 添加到数组开头（最新的在前面）
            
            // 清零当前计时
            startTimestamp = null;
            clearInterval(timerInterval);
            
            // 保存数据
            saveData();
            
            // 隐藏弹窗，显示设置表单
            hideResetModal();
            showSetupForm();
            
            // 重置输入框为当前时间
            const now2 = new Date();
            const localDateTime = new Date(now2.getTime() - now2.getTimezoneOffset() * 60000)
                .toISOString()
                .slice(0, 16);
            document.getElementById('startTime').value = localDateTime;
        }

        // 切换历史记录显示
        function toggleHistory() {
            const historyList = document.getElementById('historyList');
            const isExpanded = historyList.classList.contains('expanded');
            
            if (isExpanded) {
                historyList.classList.remove('expanded');
            } else {
                historyList.classList.add('expanded');
                updateHistoryDisplay();
            }
        }

        // 更新历史记录显示
        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            
            if (historyData.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无历史记录</div>';
                return;
            }
            
            const historyHTML = historyData.map(item => {
                const duration = formatDuration(item.duration);
                const startDate = formatDate(item.startTime);
                const endDate = formatDate(item.endTime);
                
                return `
                    <div class="history-item">
                        <div class="history-duration">${duration}</div>
                        <div class="history-date">
                            ${startDate} 至 ${endDate}
                        </div>
                    </div>
                `;
            }).join('');
            
            historyList.innerHTML = historyHTML;
        }

        // 格式化持续时间
        function formatDuration(duration) {
            const seconds = Math.floor(duration / 1000) % 60;
            const minutes = Math.floor(duration / (1000 * 60)) % 60;
            const hours = Math.floor(duration / (1000 * 60 * 60)) % 24;
            const days = Math.floor(duration / (1000 * 60 * 60 * 24));
            
            return `${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }

        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('resetModal');
            if (event.target === modal) {
                hideResetModal();
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
</html>
