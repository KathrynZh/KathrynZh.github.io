            z-index: -1;

            width: 100%;

            z-index: 1;

            opacity: 0;

        }

        }

        /*.title::after {
            content: '💕';

        @keyframes heartbeat {

        .btn:active {

        /* 弹窗样式 */
        .modal {
            display: none;

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            opacity: 1;
            transition: fadeOut 0.3s ease;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .modal.closing {
            animation: fadeOut 0.3s ease forwards;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;

            overflow-y: auto;
            animation: slideUp 0.3s ease;

        @keyframes slideUp {
            from {

                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }

        .garden-info {
            background: rgba(255, 182, 193, 0.05);

            border: 1px solid rgba(255, 182, 193, 0.2);

            justify-content: center;
            align-items: center;
            min-height: 250px;

        .garden-grid {
            display: grid;
            gap: 3px;
            background: rgba(139, 69, 19, 0.1);
            padding: 10px;
            border-radius: 12px;
            border: 2px solid rgba(139, 69, 19, 0.2);

            border-radius: 6px;

            position: relative;

        .flower-cell:hover {

            background: rgba(101, 67, 33, 0.2);

        .flower-cell.watered {

            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }

        /* 卡片切换器样式 */

            left: 50%;
            transform: translateX(-50%);

            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .garden-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

<body>

    <!-- 清零确认弹窗：填写吵架发生时间 -->
    <div id="reset-modal" class="modal">
      <div class="modal-content">
        <h3 style="text-align: center;">🥺 确认清零吗？</h3>
        <p class="confirm-text">这段时间将被好好保存，相信我们可以慢慢调整好，再重新出发。</p>
        <div class="form-group">
          <label class="form-label" for="quarrel-time-input">事故发生时间：</label>
          <input type="datetime-local" id="quarrel-time-input" class="form-input">
        </div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeModal('reset-modal')">取消</button>
          <button class="btn" onclick="handleConfirmResetWithTime()">确认</button>
        </div>
      </div>
    </div>
    
    <!-- 历史记录弹窗 -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">历史记录</h3>
            <div id="history-list"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('history-modal')">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let history = [];
        let lastEndTime = null; // 🆕 新增：记录上次结束时间用于计算break

        // 花园相关变量
        let gardenLevel = 1;
        let waterCount = 0;
        let currentCard = 'timer';

        document.addEventListener('DOMContentLoaded', function () {
            loadData();
            initializeApp();
            // 新增：花园初始化
            setTimeout(() => {
            initializeGarden();
            }, 100);

            // 监听输入框回车
            //document.getElementById('initial-time').addEventListener('keydown', function(e) {
            //    if (e.key === 'Enter') {
            //        setInitialTime();
            //    }
            //});
        });

        function loadData() {
            const savedStartTime = localStorage.getItem('loveTimerStart');
            const savedHistory = localStorage.getItem('loveTimerHistory');

            if (savedStartTime) {
                startTime = new Date(savedStartTime);
            }

            if (savedHistory) {
                try {
                    history = JSON.parse(savedHistory);
                } catch (e) {
                    history = [];
                }
            }
        }

        function saveData() {
            if (startTime) {
                localStorage.setItem('loveTimerStart', startTime.toISOString());
            }
            localStorage.setItem('loveTimerHistory', JSON.stringify(history));
        }

        function initializeApp() {
            if (startTime) {
                document.getElementById('main-screen').style.display = 'block';
                document.getElementById('setup-screen').classList.remove('active');
                document.getElementById('milestone-message').style.display = 'block'; // 👈 显示文案

                // 标题改为“本恋爱已安全运行”
                document.querySelector('.title').textContent = '💗 本恋爱已安全运行';

                startTimer();
            } else {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('setup-screen').classList.add('active');
                document.getElementById('milestone-message').style.display = 'none';

                // 标题恢复为原始状态
                document.querySelector('.title').textContent = '💕 恋爱安全运行记录';

                const now = new Date();
                const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                    .toISOString().slice(0, 16);
                document.getElementById('initial-time').value = localDateTime;
            }
        }

        function setInitialTime() {
            const timeInput = document.getElementById('initial-time').value;
            if (!timeInput) {
                alert('请选择一个时间');
                return;
            }

            startTime = new Date(timeInput);

            if (lastEndTime) {
                const newStart = new Date(timeInput);
                const breakDuration = newStart - lastEndTime;
                if (breakDuration > 0) {
                    const breakDays = Math.floor(breakDuration / (1000 * 60 * 60 * 24));
                    const breakHours = Math.floor((breakDuration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const breakMinutes = Math.floor((breakDuration % (1000 * 60 * 60)) / (1000 * 60));

                    history.unshift({
                        id: 'break-' + Date.now(), // 方便区分
                        isBreak: true, // 🆕 用于渲染时判断
                        startTime: lastEndTime.toISOString(),
                        endTime: newStart.toISOString(),
                        duration: breakDuration,
                        durationText: `${breakDays}天${breakHours}小时${breakMinutes}分钟`
                    });
                    lastEndTime = null; // 🆕 清空已使用的记录
                }
            }

            saveData();

            //修改标题
            document.querySelector('.title').textContent = '💗 本恋爱已安全运行';

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('main-screen').style.display = 'block';

            startTimer();
            updateTimerDisplay();
            document.getElementById('milestone-message').style.display = 'block';
        }

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function updateTimerDisplay() {
            if (!startTime) return;

            const now = new Date();
            const timeDiff = now - startTime;

            if (timeDiff < 0) {
                document.getElementById('timer-display').innerHTML = '时间设置有误，请重新设置';
                return;
            }

            const seconds = Math.floor(timeDiff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            const displaySeconds = seconds % 60;
            const displayMinutes = minutes % 60;
            const displayHours = hours % 24;

            const timeText = `
                <span class="time-number">${days}</span> 天 
                <span class="time-number">${displayHours}</span> 小时 
                <span class="time-number">${displayMinutes}</span> 分钟 
                <span class="time-number">${displaySeconds}</span> 秒`;

            document.getElementById('timer-display').innerHTML = timeText;

            const messageEl = document.getElementById('milestone-message');
            let message = '';

            if (days >= 60) {
                message = `本恋爱已连续安全运行 ${days} 天，系统认证：超级稳定情侣 👩🏻‍❤️‍💋‍👨🏻`;
            /*} else if (days >= 60) {
                message = `已经两个月啦，谢谢你和我一起坚持不争吵 🥰`;*/
            } else if (days >= 30) {
                message = `已经一个月啦，谢谢你和我一起坚持不争吵 🥰`;
            } else if (days >= 15) {
                message = `连续 ${days} 天和平运行，恋爱系统表示非常满意 ✨！`;
            } else if (days >= 7) {
                message = `咚咚锵～恋爱小火车稳稳运行 ${days} 天咯 🚂💞`;
            }

            if (message) {
                messageEl.textContent = message;
                messageEl.classList.add('show');
            } else {
                messageEl.textContent = '';
                messageEl.classList.remove('show');
            }
        }

        function showResetModal() {
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('quarrel-time-input').value = localDateTime;
            document.getElementById('reset-modal').classList.add('active');
        }

        function handleConfirmReset() {
            if (startTime) {
                const now = new Date();
                const duration = now - startTime;
                const days = Math.floor(duration / (1000 * 60 * 60 * 24));
                const hours = Math.floor((duration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((duration % (1000 * 60 * 60)) / (1000 * 60));

                history.unshift({
                    id: Date.now(),
                    startTime: startTime.toISOString(),
                    endTime: now.toISOString(),
                    duration: duration,
                    durationText: `${days}天${hours}小时${minutes}分钟`
                });
            }

            startTime = null;
            localStorage.removeItem('loveTimerStart'); // ✅关键修改：彻底清除 startTime
            saveData();

            closeModal('reset-modal');
            initializeApp();
        }

        function showHistoryModal() {
            renderHistoryList();
            document.getElementById('history-modal').classList.add('active');
        }

        function deleteHistoryItem(id) {
            //history = history.filter(item => item.id !== id);
            history = history.filter(item => item.id.toString() !== id.toString()); // ✅ 改为字符串比较
            saveData();
            renderHistoryList();
        }

        function renderHistoryList() {
            const historyList = document.getElementById('history-list');

            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无历史记录</div>';
                return;
            }

            let html = '';
            let safetyCount = history.filter(i => !i.isBreak).length; // 先统计总次数
            history.forEach((item) => {
                const startDate = new Date(item.startTime);
                const endDate = new Date(item.endTime);
                const formatStart = startDate.toLocaleString('zh-CN');
                const formatEnd = endDate.toLocaleString('zh-CN');
                const isBreak = item.isBreak;

                const label = isBreak
                    ? `🛑 第 ${safetyCount} 次事故`
                    : `第 ${safetyCount--} 次安全记录`;

                html += `
                    <div class="history-item">
                        <button class="delete-btn" onclick="deleteHistoryItem('${item.id}')">×</button>
                        <div class="history-title">${label}</div>
                        <div class="history-details">
                            ${isBreak ? '间隔时长：' : '运行时长：'}${item.durationText}<br>
                            ${isBreak ? '事故时间：' : '起始时间：'}${formatStart}<br>
                            ${isBreak ? '恢复时间：' : '结束时间：'}${formatEnd}
                        </div>
                    </div>`;
            });

            /*history.forEach((item, index) => {
                const startDate = new Date(item.startTime);
                const formatDate = startDate.toLocaleString('zh-CN');

                html += `
                    <div class="history-item">
                        <button class="delete-btn" onclick="deleteHistoryItem(${item.id})">×</button>
                        <div class="history-title">第 ${history.length - index} 次记录</div>
                        <div class="history-details">
                            运行时长：${item.durationText}<br>
                            起始时间：${formatDate}
                        </div>
                    </div>`;
            });*/

            historyList.innerHTML = html;
        }

        /*function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }*/

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('closing');
            setTimeout(() => {
            modal.classList.remove('active', 'closing');
        }, 300); // 与 fadeOut 动画一致
    }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });

        window.addEventListener('beforeunload', function () {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
        });

        window.addEventListener('focus', function () {
            if (startTime && !timerInterval) {
                startTimer();
            }
        });

        function handleConfirmResetWithTime() {
            const timeInput = document.getElementById('quarrel-time-input').value;
            if (!timeInput) {
              alert('请填写吵架时间');
              return;
            }

            const customEndTime = new Date(timeInput);
            if (!startTime) {
              alert('开始时间不存在，请刷新页面重试');
              return;
            }

            if (customEndTime <= startTime) {
              alert('吵架时间必须在开始时间之后');
              return;
            }

            const duration = customEndTime - startTime;
            const days = Math.floor(duration / (1000 * 60 * 60 * 24));
            const hours = Math.floor((duration % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((duration % (1000 * 60 * 60)) / (1000 * 60));

            history.unshift({
              id: Date.now(),
              startTime: startTime.toISOString(),
              endTime: customEndTime.toISOString(),
              duration: duration,
              durationText: `${days}天${hours}小时${minutes}分钟`
            });

            lastEndTime = customEndTime; // 🆕 新增：记录上一次的结束时间

            startTime = null;
            localStorage.removeItem('loveTimerStart');
            saveData();

            closeModal('reset-modal');
            initializeApp();
        }

        // 花朵图标数组，按等级分类
        const flowerTypes = {
        1: ['🌸', '🌺'],
        2: ['🌸', '🌺', '🌻', '🌷'],
        3: ['🌸', '🌺', '🌻', '🌷', '🏵️', '🌹'],
        4: ['🌸', '🌺', '🌻', '🌷', '🏵️', '🌹', '💐', '🌼'],
        5: ['🌸', '🌺', '🌻', '🌷', '🏵️', '🌹', '💐', '🌼', '🥀', '✨']
        };

        // 初始化花园数据
        function initializeGarden() {
        const savedGardenData = localStorage.getItem('gardenData');
        if (savedGardenData) {
        try {
            const data = JSON.parse(savedGardenData);
            gardenLevel = data.level || 1;
            waterCount = data.waterCount || 0;
        } catch (e) {
            console.log('花园数据加载失败，使用默认值');
        }
        }

        // 根据恋爱天数计算等级
        calculateGardenLevel();
        updateGardenDisplay();
        generateGarden();
        }

        // 根据恋爱天数和浇水次数计算花园等级
        function calculateGardenLevel() {
        let level = 1;

        // 基于恋爱天数的等级
        if (startTime) {
        const now = new Date();
        const days = Math.floor((now - startTime) / (1000 * 60 * 60 * 24));
        level = Math.floor(days / 30) + 1; // 每30天升一级
        }

        // 基于浇水次数的额外等级
        const waterBonus = Math.floor(waterCount / 10); // 每10次浇水额外升一级
        level += waterBonus;

        // 最高等级限制
        gardenLevel = Math.min(level, 5);
        }

        // 生成花园网格
        function generateGarden() {
        const gridSize = Math.min(3 + gardenLevel, 6); // 最小4x4，最大6x6
        const gardenGrid = document.getElementById('garden-grid');

        // 设置网格布局
        gardenGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
        gardenGrid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

        // 清空现有内容
        gardenGrid.innerHTML = '';

        // 获取当前等级可用的花朵类型
        const availableFlowers = flowerTypes[gardenLevel] || flowerTypes[1];

        // 生成花朵
        for (let i = 0; i < gridSize * gridSize; i++) {
        const cell = document.createElement('div');
        cell.className = 'flower-cell';
        cell.onclick = () => waterFlower(cell);

        // 随机选择花朵
        const randomFlower = availableFlowers[Math.floor(Math.random() * availableFlowers.length)];
        cell.textContent = randomFlower;

        gardenGrid.appendChild(cell);
        }

        // 更新花朵数量显示
        document.getElementById('flower-count').textContent = gridSize * gridSize;
        }

        // 浇水功能
        function waterGarden() {
        waterCount++;
        calculateGardenLevel();
        updateGardenDisplay();
        saveGardenData();

        // 给所有花朵添加浇水动画
        const flowers = document.querySelectorAll('.flower-cell');
        flowers.forEach((flower, index) => {
        setTimeout(() => {
            flower.classList.add('watered');
            setTimeout(() => {
                flower.classList.remove('watered');
            }, 600);
        }, index * 50);
        });

        // 有概率触发等级提升
        const oldLevel = gardenLevel;
        calculateGardenLevel();
        if (gardenLevel > oldLevel) {
        setTimeout(() => {
            alert(`🎉 花园升级到 ${gardenLevel} 级了！解锁了新的花朵品种！`);
            generateGarden();
        }, 1000);
        }
        }

        // 点击单个花朵浇水
        function waterFlower(cell) {
            cell.classList.add('watered');
            setTimeout(() => {
                cell.classList.remove('watered');
            }, 600);
        }

        // 重新生成花园布局
        function regenerateGarden() {
        generateGarden();
        }

        // 更新花园显示信息
        function updateGardenDisplay() {
        document.getElementById('garden-level').textContent = gardenLevel;
        document.getElementById('water-count').textContent = waterCount;
        }

        // 保存花园数据
        function saveGardenData() {
            const gardenData = {
                level: gardenLevel,
                waterCount: waterCount
            };
                localStorage.setItem('gardenData', JSON.stringify(gardenData));
        }

        // 切换卡片
        function switchCard(cardType) {
            const timerCard = document.getElementById('main-screen').parentElement;
            const gardenCard = document.getElementById('garden-card');
            const timerBtn = document.getElementById('timer-btn');
            const gardenBtn = document.getElementById('garden-btn');
            const body = document.body;

            if (cardType === 'timer') {
                // 显示计时器卡片
                timerCard.style.display = 'block';
                gardenCard.style.display = 'none';
                document.getElementById('milestone-message').style.display = 'block';

                // 切换按钮状态
                timerBtn.classList.add('active');
                gardenBtn.classList.remove('active');

                // 切换背景
                body.classList.remove('garden-background');

                currentCard = 'timer';
            } else {
                // 显示花园卡片
                timerCard.style.display = 'none';
                gardenCard.style.display = 'block';
                document.getElementById('milestone-message').style.display = 'none';

                // 切换按钮状态
                timerBtn.classList.remove('active');
                gardenBtn.classList.add('active');

                // 切换背景
                body.classList.add('garden-background');

                // 初始化花园（如果还没初始化）
                if (!document.getElementById('garden-grid').children.length) {
                    initializeGarden();
                }

                currentCard = 'garden';
            }
        }

        // 页面可见性变化时重新生成花园（实现每次切换随机布局）
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && currentCard === 'garden') {
                generateGarden();
            }
        });
</script>
